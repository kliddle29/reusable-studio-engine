<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reusable Studio Engine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e27; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    // --- src/utils/math.js ---
    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function mapRange(value, inMin, inMax, outMin, outMax) {
      const t = clamp((value - inMin) / (inMax - inMin), 0, 1);
      return lerp(outMin, outMax, t);
    }

    // --- src/canvas/setupCanvas.js ---
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      canvas.style.width = `${window.innerWidth}px`;
      canvas.style.height = `${window.innerHeight}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function initCanvas() {
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();
    }

    // --- src/canvas/loop.js ---
    const BACKGROUND = '#0a0e27';
    const RING_COLOR = '#64ffda';
    const MIN_RADIUS = 20;
    const MAX_RADIUS = 150;
    const RING_WIDTH = 3;

    function draw() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      ctx.fillStyle = BACKGROUND;
      ctx.fillRect(0, 0, width, height);

      const radius = mapRange(input.x, 0, width, MIN_RADIUS, MAX_RADIUS);

      ctx.beginPath();
      ctx.arc(width / 2, height / 2, radius, 0, Math.PI * 2);
      ctx.strokeStyle = RING_COLOR;
      ctx.lineWidth = RING_WIDTH;
      ctx.stroke();
    }

    function startLoop() {
      function frame() {
        draw();
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    // --- src/input/input.js ---
    const input = {
      x: window.innerWidth / 2,
      y: window.innerHeight / 2,
      keys: {},
    };

    function initInput() {
      window.addEventListener('mousemove', (event) => {
        input.x = event.clientX;
        input.y = event.clientY;
      });

      window.addEventListener('keydown', (event) => {
        input.keys[event.key] = true;
      });

      window.addEventListener('keyup', (event) => {
        input.keys[event.key] = false;
      });
    }

    // --- main.js ---
    initCanvas();
    initInput();
    startLoop();
  </script>
</body>
</html>
